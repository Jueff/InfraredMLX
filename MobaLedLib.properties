{
    id : "IRReceiverExtension",
    platforms :
    [
        "ESP32",
        "PICO"
    ],
    types :
    [
        {
            "TypeName" : "IRReceiverNEC",
            "Arguments" : 
            [
                "Pin_Number",
                "Address_Offs"
            ],
            "DisplayName" : "NEC Infrared receiver",
            "ShortDescription" : "enable control of MobaLedLib using a NEC compatible infrared remote control",
            "DetailedDescription" : "Infrared receiver data are detected at given pin number. The address offset is added to the received command number."
        },
        {
            "TypeName" : "IRReceiverRC5",
            "Arguments" : 
            [
                "Pin_Number",
                "Address_Offs"
            ],
            "DisplayName" : "RC5 Infrared receiver",
            "ShortDescription" : "enable control of MobaLedLib using a RC5 compatible infrared remote control",
            "DetailedDescription" : "Infrared receiver data are detected at given pin number. The address offset is added to the received command number."
        }
        
    ],
    macros :
    [
        {
            "Macro" : "#define MLL_IRRECEIVE_DEBUG",
            "Arguments" : 
            [
            ],
            "DisplayName" : "Show infrared telegrams",
            "ShortDescription" : "Display of interface telegrams and actions for test purposes.",
            "DetailedDescription" : "With this parameter the infrared received packets are displayed on the serial monitor of the Arduino IDE (baud rate 115200). This can be used to determine which data is received via the infrared interface. Attention: The serial monitor must be closed when sending data to the Arduino."
        }
    ],
    parameters :
    [
    ],
    "includes" : "InfraredMLX.h"
    "macroIncludes" : ""
}
